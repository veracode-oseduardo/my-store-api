version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: my-store-api:dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./:/app
      - /app/node_modules
    restart: unless-stopped
